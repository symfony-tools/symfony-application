name: CI

on:
  push: ~
  pull_request: ~

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Download dependencies
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: ./bin/console cache:warmup --env dev
